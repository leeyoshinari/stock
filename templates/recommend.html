<!DOCTYPE html>
<html>
<head>
    <title>Stock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" type="image/x-icon" href="{{ prefix }}/static/favicon.svg">
    <link rel="stylesheet" href="{{ prefix }}/static/index.css">
    <script>
        const prefix = "{{ prefix }}";
    </script>
    <style>
        a {cursor: pointer;}
        .title-header {
            font-size: large;
            font-weight: bold;
        }
        #today-list, #hold-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            flex-wrap: nowrap;
            justify-content: space-around;
            align-items: center;
        }
        #today-list>div, #hold-list>div {
            text-align: center;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr;
            height: 36px;
            align-items: center;
        }
        #hold-list>div {grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr;}
        #today-list>div > :first-child, #hold-list>div > :first-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #today-list>div:hover, #hold-list>div:hover {
            background-color: #ffeaa7 !important;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container" style="margin:auto;max-width:820px;">
        <div style="margin: 20px 0px;"><span style="font-weight:bold;">当前日期: </span><span id="curr-day"></span>
            <span style="font-weight:bold;margin-left:12px;">总资金: </span><span id="curr-total"></span>
            <span style="font-weight:bold;margin-left:12px;">可用: </span><span id="curr-av"></span>
            <span style="font-weight:bold;margin-left:12px;">持仓: </span><span id="curr-hold"></span>
            <span style="font-weight:bold;margin-left:12px;">收益: </span><span id="curr-profit"></span></div>
        <div class="capital-trend">
            <div class="title-header">收益曲线</div>
            <div class="capital-chart"><div id="capital-figure"></div></div>
        </div>
        <div class="today-list" style="margin-top:36px;">
            <div class="title-header">今日交易</div>
            <div id="today-list"></div>
        </div>
        <div class="hold-list" style="margin-top:36px;">
            <div class="title-header">持仓列表</div>
            <div id="hold-list"></div>
        </div>
        <div class="stock-chart"><div id="figure"></div></div>
        <div class="stock-data"><div id="data-tips">
            <div id="stock-info" style="font-size:larger;font-weight:bold;"></div>
            <div style="display:block;"><span style="font-weight:bold;">评级: </span><span id="stock-rank" style="color:red;"></span></div>
            <div style="display:block;"><span style="font-weight:bold;">核心观点: </span><span id="stock-core-text"></span></div>
            <div style="display:block;"><span style="font-weight:bold;">详细分析: </span><span id="stock-detail-text"></span></div>
            <div style="display:block;"><span style="font-weight:bold;">风险点: </span><span id="stock-risk"></span></div>
            <div style="display:block;"><span style="font-weight:bold;">点位: </span><span id="stock-position"></span></div>
        </div></div>
        <div class="modal_cover"><div class="modal_gif"></div></div>
    </div>
</body>
<script src="{{ prefix }}/static/common.js"></script>
<script src="{{ prefix }}/static/echarts.min.js"></script>
<script src="{{ prefix }}/static/plot.js"></script>
<script src="{{ prefix }}/static/recommend.js"></script>
</html>
