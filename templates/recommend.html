<!DOCTYPE html>
<html>
<head>
    <title>Stock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" type="image/x-icon" href="{{ prefix }}/static/favicon.svg">
    <link rel="stylesheet" href="{{ prefix }}/static/index.css">
    <script>
        const prefix = "{{ prefix }}";
    </script>
    <style>
        a {cursor: pointer;}
        .title-header {
            font-size: large;
            font-weight: bold;
        }
        #today-list, #hold-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            flex-wrap: nowrap;
            justify-content: space-around;
            align-items: center;
        }
        #today-list>div, #hold-list>div {
            text-align: center;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr;
            height: 36px;
            align-items: center;
        }
        #hold-list>div {grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr;}
        #today-list>div > :first-child, #hold-list>div > :first-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #today-list>div:hover, #hold-list>div:hover {
            background-color: #ffeaa7 !important;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container" style="width:50%;margin:auto;">
        <div class="capital-trend">
            <div class="title-header">收益曲线</div>
            <div class="capital-chart"><div id="capital-figure"></div></div>
        </div>
        <div class="today-list" style="margin-top:36px;">
            <div class="title-header">今日交易</div>
            <div id="today-list"></div>
        </div>
        <div class="hold-list" style="margin-top:36px;">
            <div class="title-header">持仓列表</div>
            <div id="hold-list"></div>
        </div>
        <div class="stock-chart"><div id="figure"></div></div>
        <div class="stock-data"><div id="data-tips"></div></div>
        <div class="modal_cover"><div class="modal_gif"></div></div>
    </div>
</body>
<script src="{{ prefix }}/static/common.js"></script>
<script src="{{ prefix }}/static/recommend.js"></script>
<script src="{{ prefix }}/static/echarts.min.js"></script>
<script src="{{ prefix }}/static/plot.js"></script>
</html>
